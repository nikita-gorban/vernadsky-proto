<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vernadsky — three orbits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single screen: the orbit canvas fills the viewport, with only utility overlays on top (UI comes later).
     The dark look is deliberate and shared by both themes: the renders read best on dark. */
  :root {
    --bg: #0b0c0e;
    --fg: #e9e6df;
    --dim: rgba(233, 230, 223, .62);
    --line: rgba(233, 230, 223, .45);
    --accent: #e9e6df;
    --hud: rgba(11, 12, 14, .72);
    --ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden;
         -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
                cursor: grab; }
  canvas#view.drag { cursor: grabbing; }

  /* Orbit height: tick marks on the right, top to bottom in orbits.json order (swipe up = higher). */
  .levels { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: 50%;
            transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  .levels button { appearance: none; border: 0; background: none; padding: 6px 0 6px 14px; cursor: pointer;
                   display: flex; align-items: center; gap: 8px; color: var(--dim); font: 500 11px/1 var(--mono);
                   letter-spacing: .06em; }
  .levels button i { display: block; width: 18px; height: 2px; background: var(--line); border-radius: 1px;
                     transition: width .18s, background .18s; }
  .levels { filter: drop-shadow(0 0 6px rgba(0,0,0,.55)); }
  .levels button { text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .levels button.on { color: var(--fg); }
  .levels button.on i { width: 28px; background: var(--accent); }
  .levels button:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

  .hint { position: absolute; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px));
          transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); text-align: center;
          font: 13px/1.4 var(--ui); color: var(--fg); text-shadow: 0 1px 4px rgba(0,0,0,.8); transition: opacity .6s; pointer-events: none; }
  .hint.gone { opacity: 0; }

  .note { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
          max-width: calc(100% - 32px); font: 11px/1.4 var(--mono); color: var(--dim); text-shadow: 0 1px 3px rgba(0,0,0,.8);
          pointer-events: none; }
  .load { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
  .load i { display: block; height: 100%; width: 0; background: var(--fg); opacity: .5; transition: width .2s; }
  .load.done { opacity: 0; transition: opacity .8s .4s; }

  .msg { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
         text-align: center; font: 14px/1.5 var(--ui); color: var(--dim); }

  /* Debug (D key or ?debug): all orbits at the current angle, to check that the frames line up. */
  .dbg { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
         background: var(--hud); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
         font: 11px/1.5 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; max-width: calc(100% - 90px); }
  .dbg .strip { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dbg .strip div { display: flex; flex-direction: column; gap: 3px; color: var(--dim); }
  .dbg .strip div.on { color: var(--fg); }
  .dbg canvas { width: 120px; height: 90px; background: #000; border: 1px solid var(--line); }
  .dbg .strip div.on canvas { border-color: var(--fg); }
  .dbg pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .levels button i, .hint, .load i { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view" aria-label="Building fly-around: drag horizontally to rotate, up and down to change height"></canvas>
  <nav class="levels" id="levels" aria-label="Orbit height"></nav>
  <div class="hint" id="hint">Drag left-right to orbit · up-down to change height</div>
  <div class="note" id="note" hidden></div>
  <div class="load" id="load"><i></i></div>
  <div class="dbg" id="dbg" hidden></div>
</div>

<script>
(async () => {
  'use strict';
  // ------------------------------------------------------------------------------------------------------------------
  // Model. Camera position is a single value, turn (fraction of a revolution, 0…1, wrapping), plus the orbit index.
  // turn is a shared "world" angle for all orbits. The orbit frame for it is:
  //     k = offset + dir · round(turn · count)   (mod count)
  // Each orbit has its own offset and dir (reverse), found by tools/prepare_orbits.py by comparing orbit frames.
  // So switching orbits leaves turn unchanged and the building stays at the same angle. Orbits may have
  // different frame counts: everything is computed as a fraction of a revolution.
  // ------------------------------------------------------------------------------------------------------------------
  const qs = new URLSearchParams(location.search);
  const base = qs.get('src') || window.ORBITS_BASE || 'frames/';
  const $ = id => document.getElementById(id);
  const canvas = $('view'), ctx = canvas.getContext('2d');
  const msg = t => { const d = document.createElement('div'); d.className = 'msg'; d.textContent = t; $('stage').append(d); };

  let M;
  try { M = await (await fetch(base + 'orbits.json', { cache: 'no-cache' })).json(); }
  catch (e) { msg('Could not load ' + base + 'orbits.json. Prepare the frames first (tools/prepare_orbits.py).'); return; }

  if (M.note) { $('note').textContent = M.note; $('note').hidden = false; }
  const CFG = Object.assign({
    degPerPx: 0.3,      // orbit degrees per CSS pixel of drag
    dragSign: 1,        // 1: drag right = ascending frames; -1 = the opposite
    switchPx: 70,       // vertical CSS pixels per height step
    hysteresis: 0.2,    // fraction of switchPx, prevents flicker at the threshold
    followMs: 60,       // image catches up with the finger in ~this time (smooths event jitter)
    parallel: 6,        // concurrent downloads
  }, M.controls || {});
  const orbits = M.orbits.map(o => Object.assign({ pad: 4, ext: 'webp', offset: 0, reverse: false, zoom: 1, shiftY: 0 }, o));
  orbits.forEach(o => { o.imgs = new Array(o.count).fill(null); o.ok = new Uint8Array(o.count); o.dir = base + o.dir; });
  const N = orbits.length;
  const mod = (a, n) => ((a % n) + n) % n;
  const frameOf = (o, t) => mod(o.offset + (o.reverse ? -1 : 1) * Math.round(mod(t, 1) * o.count), o.count);
  const url = (o, k) => o.pack ? o.blobs[k] : o.dir + String(k).padStart(o.pad, '0') + '.' + o.ext;

  let level = Math.max(0, orbits.findIndex(o => String(o.id) === String(qs.get('orbit') ?? M.start?.orbit)));
  let turn = qs.has('deg') ? +qs.get('deg') / 360 : (M.start?.turn || 0);
  let target = turn;

  // --- Loading: current orbit around the current angle first, plus neighbouring orbits at that angle -------------
  // (so height switches are instant), then everything else by distance from the angle.
  let inflight = 0, loaded = 0;
  const total = orbits.reduce((s, o) => s + o.count, 0);
  function nextToLoad() {
    let best = null, bestScore = Infinity;
    for (let li = 0; li < N; li++) {
      const o = orbits[li], c = frameOf(o, turn), lw = Math.abs(li - level);
      for (let k = 0; k < o.count; k++) {
        if (o.imgs[k] || (o.pack && !o.blobs[k])) continue;   // packed frame has not arrived yet
        const d = Math.min(mod(k - c, o.count), mod(c - k, o.count)) / o.count;  // fraction of a revolution to the frame
        const score = d * 360 + lw * (d * 360 < 6 ? 2 : 25);   // neighbouring orbits near the angle rank almost equally
        if (score < bestScore) { bestScore = score; best = [o, k]; }
      }
    }
    return best;
  }
  function pump() {
    while (inflight < CFG.parallel) {
      const n = nextToLoad();
      if (!n) return;
      const [o, k] = n, img = new Image();
      o.imgs[k] = img; inflight++;
      img.decoding = 'async';
      img.onload = () => {
        img.decode?.().catch(() => {});
        o.ok[k] = 1; inflight--; loaded++; progress(); dirty = true; pump();
      };
      img.onerror = () => { o.ok[k] = 2; inflight--; loaded++; progress(); pump(); };
      img.src = url(o, k);
    }
  }
  // Packing (optional): an orbit's frames live in several files o.pack = [name, …],
  // o.index[k] = [file number, offset, length]. Frames are interleaved (k % file count), so after the first file
  // of each orbit the full circle is already there at a coarse step, and it fills in from there.
  // Fewer requests, handy for hosting with a limit on file count.
  orbits.forEach(o => { if (o.pack) { if (!Array.isArray(o.pack)) { o.pack = [o.pack]; o.index = o.index.map(e => [0, ...e]); }
                                      o.blobs = new Array(o.count).fill(null); } });
  async function loadPacks() {
    const P = Math.max(0, ...orbits.map(o => o.pack ? o.pack.length : 0));
    for (let p = 0; p < P; p++) {
      const order = orbits.map((o, i) => i).sort((a, b) => Math.abs(a - level) - Math.abs(b - level));
      await Promise.all(order.map(async i => {
        const o = orbits[i];
        if (!o.pack || p >= o.pack.length) return;
        const buf = await (await fetch(o.dir + o.pack[p])).arrayBuffer();
        const type = 'image/' + o.ext;
        o.index.forEach(([f, off, len], k) => {
          if (f === p) o.blobs[k] = URL.createObjectURL(new Blob([buf.slice(off, off + len)], { type }));
        });
        pump();
      }));
    }
  }
  function progress() {
    $('load').firstElementChild.style.width = (100 * loaded / total) + '%';
    if (loaded === total) $('load').classList.add('done');
  }

  // --- Drawing -------------------------------------------------------------------------------------------------------
  let dirty = true, lastDrawn = null;
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    dirty = true;
  }
  addEventListener('resize', resize); resize();

  function pickFrame(o, k) {   // the wanted frame, or the nearest loaded frame of the same orbit until it loads
    if (o.ok[k] === 1) return k;
    for (let s = 1; s < o.count / 2; s++) {
      if (o.ok[mod(k + s, o.count)] === 1) return mod(k + s, o.count);
      if (o.ok[mod(k - s, o.count)] === 1) return mod(k - s, o.count);
    }
    return -1;
  }
  function drawFrame(c, cx, o, k) {
    const img = o.imgs[k], W = c.width, H = c.height;
    const s = Math.max(W / img.naturalWidth, H / img.naturalHeight) * (o.zoom || 1);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    cx.drawImage(img, (W - w) / 2, (H - h) / 2 + (o.shiftY || 0) * h, w, h);
  }
  function draw() {
    const o = orbits[level], want = frameOf(o, turn), k = pickFrame(o, want);
    const key = level + ':' + k + ':' + canvas.width + 'x' + canvas.height;
    if (k < 0 || (!dirty && key === lastDrawn)) return;
    drawFrame(canvas, ctx, o, k);
    lastDrawn = key; dirty = false;
    if (!dbg.hidden) drawDebug();
  }

  // --- Controls ------------------------------------------------------------------------------------------------------
  const levelsEl = $('levels');
  orbits.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'lvl-' + o.id;
    b.innerHTML = '<i></i>';
    b.setAttribute('aria-label', 'Orbit ' + (o.label || o.id));
    b.onclick = () => setLevel(i);
    levelsEl.append(b);
  });
  function setLevel(i) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i !== level) { level = i; dirty = true; pump(); }
    [...levelsEl.children].forEach((b, j) => { b.classList.toggle('on', j === level); b.setAttribute('aria-pressed', j === level); });
  }
  setLevel(level);

  let hinted = false;
  const unhint = () => { if (!hinted) { hinted = true; $('hint').classList.add('gone'); } };

  // Drag: X rotates the orbit, Y from the touch point steps the height (hard switch, with hysteresis).
  // Both axes work at once, so a diagonal drag does both.
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    drag = { id: e.pointerId, x: e.clientX, y0: e.clientY, startLevel: level, step: 0 };
    canvas.classList.add('drag'); unhint();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    target += CFG.dragSign * (e.clientX - drag.x) * CFG.degPerPx / 360;
    drag.x = e.clientX;
    const n = (e.clientY - drag.y0) / CFG.switchPx;          // down = plus (lower orbit), up = minus (higher orbit)
    const h = 0.5 + CFG.hysteresis;
    while (n >= drag.step + h) drag.step++;
    while (n <= drag.step - h) drag.step--;
    const want = Math.max(0, Math.min(N - 1, drag.startLevel + drag.step));
    drag.step = want - drag.startLevel;                       // clamped at the edge, so reversing reacts immediately
    setLevel(want);
  });
  const up = e => { if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('drag'); } };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  // Wheel/trackpad: horizontal rotates, vertical steps the height.
  let wheelY = 0, wheelT = 0;
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); unhint();
    target += CFG.dragSign * -e.deltaX * CFG.degPerPx / 360;
    const now = performance.now();
    if (now - wheelT > 250) wheelY = 0;
    wheelT = now; wheelY += e.deltaY;
    if (Math.abs(wheelY) > 80) { setLevel(level + Math.sign(wheelY)); wheelY = 0; }
  }, { passive: false });

  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const o = orbits[level];
      target = (Math.round(target * o.count) + (e.key === 'ArrowRight' ? 1 : -1) * CFG.dragSign) / o.count;
      unhint();
    } else if (e.key === 'ArrowUp') setLevel(level - 1);
    else if (e.key === 'ArrowDown') setLevel(level + 1);
    // e.code is the physical key, so these work in any keyboard layout.
    else if (e.code === 'KeyD') { dbg.hidden = !dbg.hidden; dirty = true; }
    else if (!dbg.hidden && (e.code === 'BracketLeft' || e.code === 'BracketRight')) {
      // Manual alignment: shift the current orbit by one frame. Copy the result to orbits.json → offset.
      const o = orbits[level];
      o.offset = mod(o.offset + (e.code === 'BracketRight' ? 1 : -1), o.count);
      dirty = true; pump();
    }
  });

  // --- Debug ---------------------------------------------------------------------------------------------------------
  const dbg = $('dbg');
  dbg.hidden = !qs.has('debug');
  dbg.innerHTML = '<div id="dbgText"></div><div class="strip">' +
    orbits.map((o, i) => '<div id="dbgCell' + i + '"><canvas width="240" height="180"></canvas><span></span></div>').join('') +
    '</div><pre>[ ] shift current orbit by a frame · ←→ frame · ↑↓ orbit · D hide</pre>';
  function drawDebug() {
    const deg = mod(turn, 1) * 360;
    $('dbgText').textContent = 'angle ' + deg.toFixed(1) + '° · orbit ' + (orbits[level].label || orbits[level].id);
    orbits.forEach((o, i) => {
      const cell = $('dbgCell' + i), c = cell.querySelector('canvas'), k = frameOf(o, turn), got = pickFrame(o, k);
      cell.classList.toggle('on', i === level);
      if (got >= 0) drawFrame(c, c.getContext('2d'), o, got);
      cell.querySelector('span').textContent = (o.label || o.id) + ': frame ' + k + (got !== k ? ' (loading)' : '') +
        ' · offset ' + o.offset + (o.reverse ? ' · rev.' : '');
    });
  }

  // --- Loop ----------------------------------------------------------------------------------------------------------
  let last = performance.now(), lastBucket = null;
  (function tick(now) {
    const dt = Math.min(100, now - last); last = now;
    if (turn !== target) {
      const d = target - turn;
      turn = Math.abs(d) < 1e-5 ? target : turn + d * (1 - Math.exp(-dt / CFG.followMs));
      dirty = true;
    }
    const bucket = level + ':' + frameOf(orbits[level], turn);
    if (bucket !== lastBucket) { lastBucket = bucket; pump(); }
    draw();
    requestAnimationFrame(tick);
  })(last);
  pump();
  loadPacks();
  window.orbit3 = { orbits, get turn() { return turn; }, get level() { return level; }, setLevel,
                    setDeg: d => { target = turn = d / 360; dirty = true; pump(); } };
})();
</script>
</body>
</html>
