<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Неометрия — ВЕРН</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
  /* Single screen: the orbit canvas fills the viewport. Neometria UI on top: a plate hanging from the top edge
     carrying the logo, and the height switcher, a plate coming out of the right edge.
     Colours from the Neometria design system (snapped from the DUGA case): sun #EF8400, graphite #221F1A,
     glint #FFFEFA. The dark ground is deliberate and shared by both themes: the renders read best on dark. */
  :root {
    --bg: #141414;
    --fg: #fcfcf8;
    --dim: #8f8b84;
    --line: #54514d;
    --hud: rgba(20, 20, 20, .78);
    --sun: #ef8400;          /* brand-sun: the one accent */
    --graphite: #221f1a;     /* brand-graphite: text on light plates, text on sun */
    --glint: #fffefa;        /* brand-glint: plates */
    --ui: "Onest", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden;
         -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
                cursor: grab; }
  canvas#view.drag { cursor: grabbing; }

  /* Top plate: hangs from the top edge (below the notch on phones), logo on it. */
  .brand { position: absolute; top: env(safe-area-inset-top, 0px); left: 50%; transform: translateX(-50%);
           background: var(--glint); color: var(--graphite); border-radius: 0 0 8px 8px;
           padding: 13px 22px 14px; display: flex; flex-direction: column; align-items: center;
           pointer-events: none; white-space: nowrap; }
  .brand .row { display: flex; align-items: center; gap: 10px; font-size: 19px; line-height: 22px; letter-spacing: -.02em; }
  .brand b { font-weight: 700; }
  .brand .proj { display: block; height: 15px; width: auto; }   /* project logo, assets/logo-verh.svg */
  .brand .n { display: flex; align-items: center; }
  .brand .n i { display: block; width: 9px; height: 9px; background: currentColor; }
  .brand .n s { display: block; width: 12px; height: 3px; background: currentColor; }
  @media (max-width: 600px) {
    .brand { padding: 10px 16px 11px; }
    .brand .row { font-size: 16px; line-height: 19px; gap: 8px; }
    .brand .proj { height: 13px; }
  }

  /* Orbit height: a plate coming out of the right edge, top to bottom in orbits.json order
     (swipe up = higher). The active height is the screen's single orange accent. */
  .levels { position: absolute; right: env(safe-area-inset-right, 0px); top: 50%;
            transform: translateY(-50%); background: rgba(255, 254, 250, .62); color: var(--graphite);
            -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
            border-radius: 6px 0 0 6px; padding: 8px 5px 5px; display: flex; flex-direction: column;
            align-items: center; gap: 2px; }
  .levels .cap { font-size: 9px; font-weight: 500; line-height: 12px; letter-spacing: .08em; color: var(--graphite);
                 opacity: .75; padding-bottom: 4px; }
  .levels button { appearance: none; border: 0; width: 40px; height: 34px; border-radius: 5px; background: transparent;
                   color: var(--graphite); font: 500 14px/1 var(--ui); font-variant-numeric: tabular-nums;
                   cursor: pointer; transition: background-color .18s; }
  .levels button:hover { background: rgba(255, 254, 250, .7); }
  .levels button.on { background: var(--sun); cursor: default; }
  .levels button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  @media (max-width: 600px) {
    .levels { padding: 7px 4px 4px; }
    .levels button { width: 38px; height: 44px; }
  }

  .load { position: absolute; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
          bottom: env(safe-area-inset-bottom, 0px); height: 2px; background: transparent; pointer-events: none; }
  .load i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .2s; }
  .load.done { opacity: 0; transition: opacity .8s .4s; }

  .msg { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
         text-align: center; font: 14px/1.5 var(--ui); color: var(--dim); }

  /* Debug (D key or ?debug): all orbits at the current angle, to check that the frames line up. */
  .dbg { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
         background: var(--hud); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
         font: 11px/1.5 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; max-width: calc(100% - 90px); }
  .dbg .strip { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dbg .strip div { display: flex; flex-direction: column; gap: 3px; color: var(--dim); }
  .dbg .strip div.on { color: var(--fg); }
  .dbg canvas { width: 120px; height: 90px; background: #000; border: 1px solid var(--line); }
  .dbg .strip div.on canvas { border-color: var(--fg); }
  .dbg pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .levels button, .load i { transition: none; } }
</style>
</head>

<script>
(async () => {
  'use strict';
  // ------------------------------------------------------------------------------------------------------------------
  // Model. Camera position is a single value, turn (fraction of a revolution, 0…1, wrapping), plus the orbit index.
  // turn is a shared "world" angle for all orbits. The orbit frame for it is:
  //     k = offset + dir · round(turn · count)   (mod count)
  // Each orbit has its own offset and dir (reverse), found by tools/prepare_orbits.py by comparing orbit frames.
  // So switching orbits leaves turn unchanged and the building stays at the same angle. Orbits may have
  // different frame counts: everything is computed as a fraction of a revolution.
  // ------------------------------------------------------------------------------------------------------------------
  const qs = new URLSearchParams(location.search);
  const base = qs.get('src') || window.ORBITS_BASE || 'frames/';
  const $ = id => document.getElementById(id);
  const canvas = $('view'), ctx = canvas.getContext('2d');
  const msg = t => { const d = document.createElement('div'); d.className = 'msg'; d.textContent = t; $('stage').append(d); };

  let M;
  try { M = await (await fetch(base + 'orbits.json', { cache: 'no-cache' })).json(); }
  catch (e) { msg('Could not load ' + base + 'orbits.json. Prepare the frames first (tools/prepare_orbits.py).'); return; }

  const CFG = Object.assign({
    degPerPx: 0.3,      // orbit degrees per CSS pixel of drag
    dragSign: 1,        // 1: drag right = ascending frames; -1 = the opposite
    switchPx: 70,       // vertical CSS pixels per height step
    hysteresis: 0.2,    // fraction of switchPx, prevents flicker at the threshold
    followMs: 60,       // image catches up with the finger in ~this time (smooths event jitter)
    parallel: 8,        // concurrent spin downloads (HTTP/2, so this is cheap)
    sharpDelayMs: 150,  // the view must rest on a frame this long before its sharp version is fetched
    sharpCache: 40,     // sharp frames kept in memory (each is ~15 MB decoded at 1920 px)
    fadeMs: 180,        // cross-fade from the spin frame to the sharp one
  }, M.controls || {});
  // Two tiers per frame (see tools/prepare_orbits.py): spin/ is light and used while moving; sharp/ is full
  // resolution and fetched only for the frame the view rests on (plus the same angle on the neighbouring orbits).
  const TIERS = Object.assign({ spin: { dir: 'spin/', ext: 'avif' }, sharp: { dir: 'sharp/', ext: 'avif' } }, M.tiers || {});
  const orbits = M.orbits.map(o => Object.assign({ pad: 4, offset: 0, reverse: false, zoom: 1, shiftY: 0 }, o));
  orbits.forEach(o => {
    o.dir = base + o.dir;
    o.spin = new Array(o.count).fill(null);   // Image per frame, once requested
    o.ok = new Uint8Array(o.count);           // spin state: 0 pending, 1 decoded, 2 failed
    o.sharp = new Map();                      // frame -> { img, ok, used }
  });
  const N = orbits.length;
  const mod = (a, n) => ((a % n) + n) % n;
  const frameOf = (o, t) => mod(o.offset + (o.reverse ? -1 : 1) * Math.round(mod(t, 1) * o.count), o.count);
  const url = (o, tier, k) => o.dir + TIERS[tier].dir + String(k).padStart(o.pad, '0') + '.' + TIERS[tier].ext;

  let level = Math.max(0, orbits.findIndex(o => String(o.id) === String(qs.get('orbit') ?? M.start?.orbit)));
  let turn = qs.has('deg') ? +qs.get('deg') / 360 : (M.start?.turn || 0);
  let target = turn;

  // --- Loading: spin tier ---------------------------------------------------------------------------------------------
  // Coarse to fine, so the whole circle can be turned within seconds and then fills in:
  //   1. a few frames around the current angle, on the current orbit and then on the others (instant height switch);
  //   2. the current orbit every 24°, 8°, 4°, 2°, 1°, each pass nearest-first;
  //   3. the other orbits the same way, two passes behind per step of height.
  // A frame that is not there yet is drawn from the nearest loaded one (pickFrame).
  const STEPS = [24, 8, 4, 2, 1];
  const passOf = k => { let p = 0; while (k % STEPS[p]) p++; return p; };
  let inflight = 0, loaded = 0, good = 0;
  const total = orbits.reduce((s, o) => s + o.count, 0);
  function nextToLoad() {
    let best = null, bestScore = Infinity;
    for (let li = 0; li < N; li++) {
      const o = orbits[li], c = frameOf(o, turn), lw = Math.abs(li - level);
      for (let k = 0; k < o.count; k++) {
        if (o.spin[k]) continue;
        const deg = Math.min(mod(k - c, o.count), mod(c - k, o.count)) / o.count * 360;
        const score = deg <= 3 ? lw + deg / 10 : 10 + passOf(k) * 10 + lw * 20 + deg / 36;
        if (score < bestScore) { bestScore = score; best = [o, k]; }
      }
    }
    return best;
  }
  // Decode before marking a frame ready, so drawing it never stalls on a decode.
  const decoded = img => (img.decode ? img.decode() : Promise.resolve()).catch(() => {});
  function pump() {
    // While a sharp frame is on its way, leave it most of the bandwidth.
    const limit = sharpInflight ? 2 : CFG.parallel;
    while (inflight < limit) {
      const n = nextToLoad();
      if (!n) return;
      const [o, k] = n, img = new Image();
      o.spin[k] = img; inflight++;
      img.decoding = 'async';
      img.onload = () => decoded(img).then(() => {
        o.ok[k] = 1; inflight--; loaded++; good++; progress(); dirty = true; pump();
      });
      img.onerror = () => {
        o.ok[k] = 2; inflight--; loaded++; progress(); pump();
        if (loaded >= 4 && !good && !failedMsg) { failedMsg = true; msg('Could not load the frames. This browser may not support AVIF images; please update it.'); }
      };
      img.src = url(o, 'spin', k);
    }
  }
  let failedMsg = false;
  function progress() {
    $('load').firstElementChild.style.width = (100 * loaded / total) + '%';
    if (loaded === total) $('load').classList.add('done');
  }

  // --- Loading: sharp tier --------------------------------------------------------------------------------------------
  let sharpInflight = 0, sharpCount = 0;
  function pumpSharp(now) {
    const want = [level, level - 1, level + 1].filter(li => li >= 0 && li < N).map(li => [orbits[li], frameOf(orbits[li], turn)]);
    for (const [o, k] of want) {
      if (sharpInflight >= 2) break;
      if (o.sharp.has(k)) continue;
      const img = new Image(), e = { img, ok: 0, used: now };
      o.sharp.set(k, e); sharpInflight++; sharpCount++;
      img.decoding = 'async';
      img.onload = () => decoded(img).then(() => { e.ok = 1; sharpInflight--; dirty = true; pump(); });
      img.onerror = () => { e.ok = 2; sharpInflight--; pump(); };
      img.src = url(o, 'sharp', k);
    }
    // Keep memory bounded: drop the least recently shown sharp frames.
    while (sharpCount > CFG.sharpCache) {
      let old = null;
      orbits.forEach(o => o.sharp.forEach((e, k) => { if (e.ok && (!old || e.used < old[2].used)) old = [o, k, e]; }));
      if (!old) break;
      old[0].sharp.delete(old[1]); old[2].img.src = ''; sharpCount--;
    }
  }

  // --- Drawing -------------------------------------------------------------------------------------------------------
  let dirty = true, lastDrawn = null, fade = null;
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.imageSmoothingQuality = 'high';   // the spin tier is upscaled on large screens; resizing resets this
    dirty = true;
  }
  addEventListener('resize', resize); resize();

  function pickFrame(o, k) {   // the wanted frame, or the nearest loaded frame of the same orbit until it loads
    if (o.ok[k] === 1) return k;
    for (let s = 1; s < o.count / 2; s++) {
      if (o.ok[mod(k + s, o.count)] === 1) return mod(k + s, o.count);
      if (o.ok[mod(k - s, o.count)] === 1) return mod(k - s, o.count);
    }
    return -1;
  }
  function drawFrame(c, cx, o, img, clear = true) {
    const W = c.width, H = c.height;
    const s = Math.max(W / img.naturalWidth, H / img.naturalHeight) * (o.zoom || 1);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    if (clear) { cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); }
    cx.drawImage(img, (W - w) / 2, (H - h) / 2 + (o.shiftY || 0) * h, w, h);
  }
  function draw(now) {
    const o = orbits[level], want = frameOf(o, turn), k = pickFrame(o, want), sh = o.sharp.get(want);
    const sharp = !!(sh && sh.ok === 1), size = ':' + canvas.width + 'x' + canvas.height;
    if (!sharp && k < 0) return;
    const key = level + ':' + (sharp ? 's' : '') + (sharp ? want : k) + size;
    if (sharp) {
      sh.used = now;
      // The sharp frame replaces the spin frame of the very same view: fade it in instead of popping.
      if (key !== lastDrawn && lastDrawn === level + ':' + want + size) fade = { key, t0: now };
    }
    if (fade && fade.key !== key) fade = null;
    if (!dirty && !fade && key === lastDrawn) return;
    const a = fade ? Math.min(1, (now - fade.t0) / CFG.fadeMs) : 1;
    if (sharp && a < 1 && k === want) {
      drawFrame(canvas, ctx, o, o.spin[k]);
      ctx.globalAlpha = a; drawFrame(canvas, ctx, o, sh.img, false); ctx.globalAlpha = 1;
    } else drawFrame(canvas, ctx, o, sharp ? sh.img : o.spin[k]);
    if (a >= 1) fade = null;
    lastDrawn = key; dirty = false;
    if (!dbg.hidden) drawDebug();
  }

  // --- Controls ------------------------------------------------------------------------------------------------------
  const levelsEl = $('levels');
  // Buttons top to bottom = highest to lowest orbit; labelled by height (N … 1), or by orbits.json "label".
  const levelBtns = orbits.map((o, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'lvl-' + o.id;
    b.textContent = o.label || String(N - i);
    b.setAttribute('aria-label', 'Высота ' + (o.label || (N - i) + ' из ' + N));
    b.onclick = () => setLevel(i);
    levelsEl.append(b);
    return b;
  });
  function setLevel(i) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i !== level) { level = i; dirty = true; pump(); }
    levelBtns.forEach((b, j) => { b.classList.toggle('on', j === level); b.setAttribute('aria-pressed', j === level); });
  }
  setLevel(level);

  // Drag: X rotates the orbit, Y from the touch point steps the height (hard switch, with hysteresis).
  // Both axes work at once, so a diagonal drag does both.
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    drag = { id: e.pointerId, x: e.clientX, y0: e.clientY, startLevel: level, step: 0 };
    canvas.classList.add('drag');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    target += CFG.dragSign * (e.clientX - drag.x) * CFG.degPerPx / 360;
    drag.x = e.clientX;
    const n = (e.clientY - drag.y0) / CFG.switchPx;          // down = plus (lower orbit), up = minus (higher orbit)
    const h = 0.5 + CFG.hysteresis;
    while (n >= drag.step + h) drag.step++;
    while (n <= drag.step - h) drag.step--;
    const want = Math.max(0, Math.min(N - 1, drag.startLevel + drag.step));
    drag.step = want - drag.startLevel;                       // clamped at the edge, so reversing reacts immediately
    setLevel(want);
  });
  const up = e => { if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('drag'); } };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  // Wheel/trackpad: horizontal rotates, vertical steps the height.
  let wheelY = 0, wheelT = 0;
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    target += CFG.dragSign * -e.deltaX * CFG.degPerPx / 360;
    const now = performance.now();
    if (now - wheelT > 250) wheelY = 0;
    wheelT = now; wheelY += e.deltaY;
    if (Math.abs(wheelY) > 80) { setLevel(level + Math.sign(wheelY)); wheelY = 0; }
  }, { passive: false });

  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const o = orbits[level];
      target = (Math.round(target * o.count) + (e.key === 'ArrowRight' ? 1 : -1) * CFG.dragSign) / o.count;
    } else if (e.key === 'ArrowUp') setLevel(level - 1);
    else if (e.key === 'ArrowDown') setLevel(level + 1);
    // e.code is the physical key, so these work in any keyboard layout.
    else if (e.code === 'KeyD') { dbg.hidden = !dbg.hidden; dirty = true; }
    else if (!dbg.hidden && (e.code === 'BracketLeft' || e.code === 'BracketRight')) {
      // Manual alignment: shift the current orbit by one frame. Copy the result to orbits.json → offset.
      const o = orbits[level];
      o.offset = mod(o.offset + (e.code === 'BracketRight' ? 1 : -1), o.count);
      dirty = true; pump();
    }
  });

  // --- Debug ---------------------------------------------------------------------------------------------------------
  const dbg = $('dbg');
  dbg.hidden = !qs.has('debug');
  dbg.innerHTML = '<div id="dbgText"></div><div class="strip">' +
    orbits.map((o, i) => '<div id="dbgCell' + i + '"><canvas width="240" height="180"></canvas><span></span></div>').join('') +
    '</div><pre>[ ] shift current orbit by a frame · ←→ frame · ↑↓ orbit · D hide</pre>';
  function drawDebug() {
    const deg = mod(turn, 1) * 360;
    $('dbgText').textContent = 'angle ' + deg.toFixed(1) + '° · orbit ' + (orbits[level].label || orbits[level].id);
    orbits.forEach((o, i) => {
      const cell = $('dbgCell' + i), c = cell.querySelector('canvas'), k = frameOf(o, turn), got = pickFrame(o, k);
      cell.classList.toggle('on', i === level);
      if (got >= 0) drawFrame(c, c.getContext('2d'), o, o.spin[got]);
      const sh = o.sharp.get(k);
      cell.querySelector('span').textContent = (o.label || o.id) + ': frame ' + k + (got !== k ? ' (loading)' : '') +
        (sh ? (sh.ok === 1 ? ' · sharp' : sh.ok ? ' · sharp failed' : ' · sharp…') : '') +
        ' · offset ' + o.offset + (o.reverse ? ' · rev.' : '');
    });
  }

  // --- Loop ----------------------------------------------------------------------------------------------------------
  let last = performance.now(), lastBucket = null, restSince = last;
  (function tick(now) {
    const dt = Math.min(100, now - last); last = now;
    if (turn !== target) {
      const d = target - turn;
      turn = Math.abs(d) < 1e-5 ? target : turn + d * (1 - Math.exp(-dt / CFG.followMs));
      dirty = true;
    }
    const bucket = level + ':' + frameOf(orbits[level], turn);
    if (bucket !== lastBucket) { lastBucket = bucket; restSince = now; pump(); }
    else if (now - restSince > CFG.sharpDelayMs) pumpSharp(now);
    draw(now);
    requestAnimationFrame(tick);
  })(last);
  pump();
  window.orbit3 = { orbits, get turn() { return turn; }, get level() { return level; }, setLevel,
                    setDeg: d => { target = turn = d / 360; dirty = true; pump(); } };
})();
</script>
</body>
</html>
